<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación Exitosa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h2 {
            color: #28a745;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #333;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            background: #007BFF;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="icon">✅</div>
        <h2>¡Correo verificado con éxito!</h2>
        <p>Gracias por confirmar tu dirección de correo electrónico.  
           Ahora tienes acceso a todos los beneficios de tu suscripción.</p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
