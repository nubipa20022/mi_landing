<!DOCTYPE html>
<html lang="es">
  {% load static %}
<head>
  <meta charset="UTF-8">
  <title>Panel Administrador</title>
 <link rel="stylesheet" href="../static/css/panel.css">
  
</head>
<body>
  <header>
    <nav class="container">
      <div class="logo">
        <span class="logo-icon"></span> Panel Admin
      </div>
      <div class="nav-links">
        <a href="{{ url_for('panel') }}">Inicio</a>
        <a href="{{ url_for('logout') }}">Salir</a>
      </div>
    </nav>
  </header>

  <main class="container" style="padding-top:120px;">
    <section class="panel-container benefit-card">
      <h1>Panel de Administración</h1>
      <form method="POST" class="subscription-form">
        <div class="form-group">
          <label for="asunto">Asunto:</label>
          <input type="text" id="asunto" name="asunto" placeholder="Escribe el asunto">
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enviar Notificaciones</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="footer-bottom container">
      <p>© 2025 Equaly - Panel Admin</p>
    </div>
  </footer>
</body>
</html>
