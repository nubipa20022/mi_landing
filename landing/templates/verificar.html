<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación de correo</title>
     <link rel="stylesheet" href="../static/css/verificar.css">
  
</head>
<body>
    <div class="contenedor">
        <h2>Verificación de correo</h2>
        <p class="info">Se envió un código de verificación al correo: <strong>{{ correo }}</strong></p>
        <form method="POST">
            <input type="text" name="codigo" placeholder="Ingresa tu código" required>
            <br>
            <button type="submit">Verificar</button>
        </form>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    {% if ok %}
    <div class="ok">{{ ok }}</div>
    {% endif %}

    <form method="POST">
    <input type="text" name="codigo" placeholder="Ingresa tu código" required>
    <button type="submit">Verificar</button>
    </form>

    <form method="POST" action="{{ url_for('reenviar', correo=correo) }}" style="margin-top:10px;">
    <button type="submit">Reenviar código</button>
    </form>
</body>
</html>
